[pytest]
# pytest 配置文件
# 作用:在没有 langchain 等重型依赖时,自动跳过相关测试
#       CI 环境(已 pip install -r requirements.txt)会跑全部测试

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认选项
addopts = -v --tb=short

# 自定义 markers
markers =
    slow: 需要下载模型或启动 Ollama,标记为慢测试
    integration: 集成测试,需要外部依赖
